name: 2008-06 browser port (WebAssembly)

on:
  workflow_dispatch:
  push:
    branches:
      - work
    paths:
      - "workspace/rebuild/2008-06/**"
      - "2008-06/**"
      - ".github/workflows/wasm-2008-06.yml"

permissions:
  contents: read

concurrency:
  group: wasm-2008-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Audit source and build browser host
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout maintained source
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 1

      - name: Set up Python for source audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit native source for WASM blockers
        run: |
          python workspace/rebuild/2008-06/wasm/audit_portability.py \
            --source workspace/rebuild/2008-06 \
            --report wasm-portability-report.json

      - name: Audit the real G3D RenderDevice contract
        run: |
          python workspace/rebuild/2008-06/wasm/renderdevice_portability.py \
            --source 2008-06 \
            --json renderdevice-portability-report.json \
            --markdown renderdevice-portability-report.md

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Compile browser host smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wasm-host
          em++ workspace/rebuild/2008-06/wasm/browser_host.cpp \
            workspace/rebuild/2008-06/wasm/webgl2_device.cpp \
            -O2 -std=c++17 \
            -sUSE_WEBGL2=1 \
            -sMIN_WEBGL_VERSION=2 \
            -sMAX_WEBGL_VERSION=2 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sENVIRONMENT=web \
            -sEXIT_RUNTIME=0 \
            -sNO_EXIT_RUNTIME=1 \
            --shell-file workspace/rebuild/2008-06/wasm/shell.html \
            -o build/wasm-host/roblox-2008-06-host.html

          test -s build/wasm-host/roblox-2008-06-host.wasm
          test -s build/wasm-host/roblox-2008-06-host.js

      - name: Check for complete native-client WASM target
        id: full-client
        shell: bash
        run: |
          if [[ -f workspace/rebuild/2008-06/CMakeLists.txt ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Full client port still in progress::The browser host compiled, but the recovered full client has no complete Emscripten CMake target yet. The host artifact is not a playable Roblox client."
          fi

      - name: Configure full client
        if: steps.full-client.outputs.available == 'true'
        run: |
          emcmake cmake -S workspace/rebuild/2008-06 -B build/wasm-client \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile full client
        if: steps.full-client.outputs.available == 'true'
        run: cmake --build build/wasm-client --parallel 2

      - name: Upload browser host, full-client output and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2008-06-wasm
          path: |
            wasm-portability-report.json
            build/wasm-host/
            build/wasm-client/
          if-no-files-found: warn
          retention-days: 14
